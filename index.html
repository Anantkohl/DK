<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ApexStream - MX & MovieBox Pro Web Player</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#00d2ff',
            brandDark: '#0072ff',
            neonOrange: '#ff6a00',
            oled: '#0a0a0c',
            surface: '#141418',
            surfaceLighter: '#1f1f26'
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0c0d12; }
    ::-webkit-scrollbar-thumb { background: #2b2e3b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00d2ff; }

    /* Video player sizing & aspect ratios */
    .aspect-fit { object-fit: contain; }
    .aspect-fill { object-fit: cover; }
    .aspect-stretch { object-fit: fill; }
    .aspect-16-9 { aspect-ratio: 16/9; object-fit: cover; }

    /* Custom range sliders */
    input[type=range] {
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
      cursor: pointer;
    }

    /* Video Progress Slider */
    .progress-bar-container:hover .progress-scrub-thumb {
      transform: scale(1.3);
      opacity: 1;
    }

    /* Glassmorphism helpers */
    .glass-panel {
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .sheet-up {
      transform: translateY(0%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sheet-down {
      transform: translateY(105%);
      transition: transform 0.22s ease-in;
    }

    /* Fullscreen layout lock */
    #playerContainer:fullscreen,
    #playerContainer:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      border-radius: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      background: #000;
    }

    /* Pulsing animations */
    @keyframes ping-slow {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-glow {
      animation: ping-slow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-oled text-gray-100 font-sans min-h-screen flex flex-col select-none antialiased">

  <!-- Top App Navigation Bar -->
  <header class="w-full glass-panel sticky top-0 z-40 px-4 py-2.5 flex items-center justify-between border-b border-white/10">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brandDark to-brand flex items-center justify-center text-black font-extrabold shadow-lg shadow-cyan-500/20">
        <i class="fa-solid fa-play text-sm"></i>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-brand bg-clip-text text-transparent">ApexStream <span class="text-xs px-1.5 py-0.5 rounded bg-brand/20 text-brand font-medium">PRO</span></h1>
        <p class="text-[10px] text-gray-400 font-medium">MX & MovieBox Engine</p>
      </div>
    </div>

    <!-- Right Quick Actions -->
    <div class="flex items-center space-x-2">
      <!-- Open Local File -->
      <label class="cursor-pointer bg-surfaceLighter hover:bg-white/10 text-xs px-3 py-1.5 rounded-lg border border-white/10 flex items-center gap-1.5 transition active:scale-95 text-gray-300 hover:text-white">
        <i class="fa-regular fa-folder-open text-brand"></i>
        <span class="hidden sm:inline">Open File</span>
        <input type="file" id="localFileInput" accept="video/*,.mkv,.mp4,.webm" class="hidden">
      </label>

      <!-- URL Input Toggle -->
      <button onclick="toggleUrlModal()" class="bg-surfaceLighter hover:bg-white/10 text-xs px-3 py-1.5 rounded-lg border border-white/10 flex items-center gap-1.5 transition active:scale-95 text-gray-300 hover:text-white">
        <i class="fa-solid fa-link text-neonOrange"></i>
        <span class="hidden sm:inline">Stream URL</span>
      </button>

      <!-- Subtitle File Loader -->
      <label class="cursor-pointer bg-surfaceLighter hover:bg-white/10 text-xs px-3 py-1.5 rounded-lg border border-white/10 flex items-center gap-1.5 transition active:scale-95 text-gray-300 hover:text-white" title="Load .srt or .vtt Subtitles">
        <i class="fa-solid fa-closed-captioning text-green-400"></i>
        <span class="hidden md:inline">Subtitle</span>
        <input type="file" id="subtitleFileInput" accept=".vtt,.srt" class="hidden">
      </label>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 w-full max-w-7xl mx-auto p-2 sm:p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT: Video Theatre Column (8 cols on desktop) -->
    <div class="lg:col-span-8 flex flex-col space-y-3">
      
      <!-- Video Player Wrapper (Responsive & Fullscreen target) -->
      <div id="playerContainer" class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-white/10 group select-none">
        
        <!-- Video Element -->
        <video id="mainVideo" class="w-full h-full aspect-fit transition-all duration-200" playsinline preload="metadata">
          <source id="videoSource" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
          <track id="mainTrack" label="English" kind="subtitles" srclang="en" default>
          Your browser doesn't support HTML5 video.
        </video>

        <!-- SUBTITLES OVERLAY CONTAINER -->
        <div id="customSubtitleBox" class="absolute bottom-16 inset-x-4 text-center pointer-events-none z-20 text-white font-semibold text-sm sm:text-base md:text-lg drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] bg-black/60 px-3 py-1 rounded max-w-max mx-auto hidden transition-opacity"></div>

        <!-- GESTURE INTERACTION SURFACE (Taps, Swipes, Longpress) -->
        <div id="gestureSurface" class="absolute inset-0 z-10 cursor-pointer"></div>

        <!-- ==================== FLOATING HUDS ==================== -->
        <!-- 1. Hold-for-2X Speed Badge -->
        <div id="hold2XBadge" class="absolute top-5 left-1/2 -translate-x-1/2 bg-black/85 text-yellow-400 border border-yellow-400/60 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold flex items-center gap-2 shadow-xl pointer-events-none z-30 hidden animate-pulse">
          <i class="fa-solid fa-forward-fast text-xs"></i> 2.0X SPEED
        </div>

        <!-- 2. Left / Right Double-Tap Seek Ripples -->
        <div id="leftSeekRipple" class="absolute left-6 top-1/2 -translate-y-1/2 bg-white/10 backdrop-blur-md text-white border border-white/20 px-5 py-3 rounded-full text-sm font-bold items-center gap-2 pointer-events-none z-30 hidden shadow-2xl">
          <i class="fa-solid fa-backward"></i> -10s
        </div>
        <div id="rightSeekRipple" class="absolute right-6 top-1/2 -translate-y-1/2 bg-white/10 backdrop-blur-md text-white border border-white/20 px-5 py-3 rounded-full text-sm font-bold items-center gap-2 pointer-events-none z-30 hidden shadow-2xl">
          +10s <i class="fa-solid fa-forward"></i>
        </div>

        <!-- 3. Brightness Swipe HUD (Left side) -->
        <div id="brightnessHud" class="absolute left-6 top-1/2 -translate-y-1/2 glass-panel px-3.5 py-4 rounded-2xl flex flex-col items-center gap-3 pointer-events-none z-30 hidden shadow-2xl border border-white/20 min-w-[55px]">
          <i id="brightIcon" class="fa-regular fa-sun text-yellow-300 text-base"></i>
          <div class="w-1.5 h-24 bg-white/20 rounded-full overflow-hidden flex flex-col justify-end">
            <div id="brightBarFill" class="w-full bg-yellow-400 transition-all duration-75" style="height: 70%;"></div>
          </div>
          <span id="brightValText" class="text-[11px] font-bold text-white tracking-wider">70%</span>
        </div>

        <!-- 4. Volume Swipe HUD (Right side) -->
        <div id="volumeHud" class="absolute right-6 top-1/2 -translate-y-1/2 glass-panel px-3.5 py-4 rounded-2xl flex flex-col items-center gap-3 pointer-events-none z-30 hidden shadow-2xl border border-white/20 min-w-[55px]">
          <i id="volumeIcon" class="fa-solid fa-volume-high text-brand text-base"></i>
          <div class="w-1.5 h-24 bg-white/20 rounded-full overflow-hidden flex flex-col justify-end">
            <div id="volumeBarFill" class="w-full bg-brand transition-all duration-75" style="height: 100%;"></div>
          </div>
          <span id="volumeValText" class="text-[11px] font-bold text-white tracking-wider">100%</span>
        </div>

        <!-- 5. Screen Lock Overlay Banner -->
        <div id="lockStateBanner" class="absolute top-5 left-5 z-40 hidden">
          <button onclick="toggleScreenLock()" class="bg-red-500/90 hover:bg-red-600 text-white p-2.5 rounded-full shadow-lg flex items-center justify-center transition active:scale-90 border border-white/20" title="Tap to unlock screen">
            <i class="fa-solid fa-lock text-sm"></i>
          </button>
        </div>

        <!-- ==================== MX PLAYER CONTROLS OVERLAY ==================== -->
        <div id="controlsOverlay" class="absolute inset-0 z-20 flex flex-col justify-between p-3 sm:p-5 bg-gradient-to-t from-black/90 via-transparent to-black/75 transition-opacity duration-300 pointer-events-auto">
          
          <!-- Top Row Controls -->
          <div class="flex items-center justify-between text-white">
            <div class="flex items-center space-x-2.5 truncate max-w-[70%]">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-brand/20 text-brand border border-brand/30 uppercase">HD</span>
              <span id="videoTitleDisplay" class="font-semibold text-sm sm:text-base truncate drop-shadow">Big Buck Bunny (2008 Open Movie)</span>
            </div>

            <!-- Top Right Player Tools -->
            <div class="flex items-center space-x-2 sm:space-x-3 text-xs sm:text-sm">
              <!-- Aspect Ratio Cycle Button -->
              <button onclick="cycleAspectRatio()" class="hover:text-brand transition p-1.5" title="Toggle Aspect Ratio (Fit, Fill, Stretch)">
                <i class="fa-solid fa-expand"></i>
                <span id="aspectRatioLabel" class="text-[10px] uppercase font-bold ml-0.5 text-gray-300">Fit</span>
              </button>
              
              <!-- Screen Lock Button -->
              <button onclick="toggleScreenLock()" class="hover:text-red-400 transition p-1.5" title="Lock Touch Screen">
                <i class="fa-solid fa-lock-open"></i>
              </button>

              <!-- Sleep Timer Toggle -->
              <button onclick="cycleSleepTimer()" class="hover:text-yellow-400 transition p-1.5 flex items-center gap-1" title="Sleep Timer">
                <i class="fa-regular fa-clock"></i>
                <span id="sleepTimerBadge" class="text-[10px] hidden font-mono text-yellow-300">OFF</span>
              </button>
            </div>
          </div>

          <!-- Center Big Play/Pause & Seek Cluster (MovieBox Style) -->
          <div class="flex items-center justify-center space-x-6 sm:space-x-10 text-white">
            <button onclick="seekOffset(-10)" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition active:scale-90 border border-white/10" title="Rewind 10s">
              <i class="fa-solid fa-rotate-left text-sm sm:text-base"></i>
            </button>
            
            <button id="centerPlayBtn" onclick="togglePlayPause()" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-gradient-to-tr from-brandDark to-brand text-black flex items-center justify-center shadow-lg shadow-cyan-500/30 transition transform hover:scale-105 active:scale-95" title="Play/Pause">
              <i id="centerPlayIcon" class="fa-solid fa-play text-xl sm:text-2xl ml-0.5"></i>
            </button>

            <button onclick="seekOffset(10)" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition active:scale-90 border border-white/10" title="Forward 10s">
              <i class="fa-solid fa-rotate-right text-sm sm:text-base"></i>
            </button>
          </div>

          <!-- Bottom Row: Timeline + Action Buttons -->
          <div class="flex flex-col space-y-1.5 text-white">
            
            <!-- Video Progress Bar with Scrub Hover -->
            <div class="progress-bar-container relative w-full h-4 flex items-center cursor-pointer group/bar" id="progressBarTrack">
              <div class="w-full h-1 bg-white/25 rounded-full overflow-hidden relative group-hover/bar:h-2 transition-all">
                <!-- Buffer fill -->
                <div id="bufferFill" class="absolute top-0 left-0 h-full bg-white/30 rounded-full" style="width: 0%;"></div>
                <!-- Playback fill -->
                <div id="progressFill" class="absolute top-0 left-0 h-full bg-gradient-to-r from-brand to-brandDark rounded-full" style="width: 0%;"></div>
              </div>
              <!-- Scrub Knob -->
              <div id="scrubKnob" class="progress-scrub-thumb absolute w-3.5 h-3.5 bg-brand rounded-full shadow-md -translate-x-1/2 pointer-events-none transition-transform opacity-0 group-hover/bar:opacity-100" style="left: 0%;"></div>
            </div>

            <!-- Lower Action Bar -->
            <div class="flex items-center justify-between text-xs sm:text-sm pt-1">
              
              <!-- Left side: Time Display & Speed Pill -->
              <div class="flex items-center space-x-3">
                <div class="font-mono text-[11px] sm:text-xs text-gray-300">
                  <span id="curTimeDisplay">00:00</span> / <span id="durTimeDisplay">00:00</span>
                </div>

                <!-- Live Speed Indicator Pill (Image 1 replica - click opens sheet) -->
                <button onclick="openSpeedSheet()" class="px-2.5 py-0.5 rounded-full bg-white/15 hover:bg-white/25 border border-white/20 text-[11px] font-semibold flex items-center gap-1 transition active:scale-95" title="Adjust playback speed">
                  <i class="fa-solid fa-bolt text-yellow-400 text-[10px]"></i>
                  <span id="currentSpeedLabel">1.0x</span>
                </button>
              </div>

              <!-- Right side: PiP, Equalizer, Fullscreen -->
              <div class="flex items-center space-x-2 sm:space-x-4">
                <!-- Subtitle Toggle -->
                <button onclick="toggleSubtitles()" id="subBtn" class="hover:text-brand transition p-1 text-gray-300" title="Toggle Subtitles">
                  <i class="fa-regular fa-closed-captioning text-base"></i>
                </button>

                <!-- PiP Button -->
                <button onclick="togglePictureInPicture()" id="pipActionBtn" class="hover:text-brand transition p-1 text-gray-300" title="Picture in Picture">
                  <i class="fa-solid fa-clone text-base"></i>
                </button>

                <!-- True Fullscreen Button -->
                <button onclick="toggleProFullscreen()" class="hover:text-brand transition p-1 text-gray-300" title="Toggle Fullscreen">
                  <i id="fsIcon" class="fa-solid fa-expand text-base"></i>
                </button>
              </div>

            </div>

          </div>

        </div>

        <!-- ==================== SPEED BOTTOM SHEET (Image 2 style) ==================== -->
        <div id="speedSheetBackdrop" class="absolute inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-end justify-center transition-opacity" onclick="closeSpeedSheet(event)">
          <div class="w-full max-w-lg bg-surface border-t border-white/15 rounded-t-3xl p-5 text-white shadow-2xl sheet-up" onclick="event.stopPropagation()">
            <!-- Drag Indicator Handle -->
            <div class="w-10 h-1 bg-white/25 rounded-full mx-auto mb-3 cursor-pointer" onclick="closeSpeedSheet()"></div>
            
            <div class="flex items-center justify-between mb-4">
              <span class="text-xs uppercase font-bold text-gray-400 tracking-wider">Playback Speed</span>
              <span id="sheetSpeedVal" class="text-xl font-black text-brand font-mono">1.00x</span>
              <button onclick="closeSpeedSheet()" class="text-gray-400 hover:text-white text-xs px-2 py-1 rounded bg-white/5">Done</button>
            </div>

            <!-- Stepper and Slider Row -->
            <div class="flex items-center space-x-3 mb-5">
              <button onclick="nudgeSpeed(-0.05)" class="w-10 h-10 rounded-full bg-surfaceLighter hover:bg-white/20 active:scale-95 flex items-center justify-center font-bold text-lg text-white border border-white/10">−</button>
              <div class="flex-1 flex items-center">
                <input type="range" id="speedSlider" min="0.25" max="2.5" step="0.05" value="1.0" class="w-full h-1.5 cursor-pointer" oninput="onSpeedSliderInput(this.value)">
              </div>
              <button onclick="nudgeSpeed(0.05)" class="w-10 h-10 rounded-full bg-surfaceLighter hover:bg-white/20 active:scale-95 flex items-center justify-center font-bold text-lg text-white border border-white/10">+</button>
            </div>

            <!-- Quick Speed Pills Grid -->
            <div class="grid grid-cols-5 gap-2 text-xs">
              <button onclick="selectSpeedPreset(0.25)" class="speed-pill py-2 rounded-xl bg-surfaceLighter hover:bg-white/15 text-gray-300 font-semibold border border-white/5">0.25</button>
              <button onclick="selectSpeedPreset(0.5)" class="speed-pill py-2 rounded-xl bg-surfaceLighter hover:bg-white/15 text-gray-300 font-semibold border border-white/5">0.5</button>
              <button onclick="selectSpeedPreset(0.75)" class="speed-pill py-2 rounded-xl bg-surfaceLighter hover:bg-white/15 text-gray-300 font-semibold border border-white/5">0.75</button>
              <button onclick="selectSpeedPreset(1.0)" class="speed-pill py-2 rounded-xl bg-brand text-black font-bold border border-brand shadow-lg shadow-brand/20">
                1.0<br><span class="text-[9px] font-normal opacity-80">Normal</span>
              </button>
              <button onclick="selectSpeedPreset(1.25)" class="speed-pill py-2 rounded-xl bg-surfaceLighter hover:bg-white/15 text-gray-300 font-semibold border border-white/5">1.25</button>

              <button onclick="selectSpeedPreset(1.5)" class="speed-pill py-2 rounded-xl bg-surfaceLighter hover:bg-white/15 text-gray-300 font-semibold border border-white/5">1.5</button>
              <button onclick="selectSpeedPreset(1.75)" class="speed-pill py-2 rounded-xl bg-surfaceLighter hover:bg-white/15 text-gray-300 font-semibold border border-white/5">1.75</button>
              <button onclick="selectSpeedPreset(2.0)" class="speed-pill py-2 rounded-xl bg-surfaceLighter hover:bg-white/15 text-gray-300 font-semibold border border-white/5">2.0</button>
              <button onclick="selectSpeedPreset(2.25)" class="speed-pill py-2 rounded-xl bg-surfaceLighter hover:bg-white/15 text-gray-300 font-semibold border bo
